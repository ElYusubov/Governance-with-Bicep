name: Release Deploy (Main)

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  DEPLOY_REGION: eastus2

jobs:
  deploy:
    environment: platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy @ Subscription Scope
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: ${{ env.DEPLOY_REGION }}
          template: infra/main.bicep
          parameters: infra/params/sub.dev.json

      - name: Post-deploy compliance summary
        run: az policy state summarize --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} | tee compliance.json

      - name: Upload compliance snapshot
        uses: actions/upload-artifact@v4
        with:
          name: compliance-snapshot
          path: compliance.json
